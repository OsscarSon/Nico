<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0E1420" />
    <title>Nico Academy · 从入门到深入的自学路径</title>
    <script>
      // 在首帧前应用主题：尊重既有偏好，无偏好时始终默认暗色。
      (() => {
        let theme = "dark";
        try {
          const saved = localStorage.getItem("nico-theme");
          if (saved === "light" || saved === "dark") theme = saved;
          else {
            const old = JSON.parse(localStorage.getItem("nico-settings") || "{}").theme;
            if (old === "light" || old === "dark") theme = old;
          }
        } catch { /* 存储不可用时使用默认暗色 */ }
        try {
          const p = JSON.parse(localStorage.getItem("nico-preferences") || "null");
          if (p?.schemaVersion === 1) {
            if (p.theme === "dark" || p.theme === "light") theme = p.theme;
            if (p.theme === "system") theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            if (p.font === "large") document.documentElement.dataset.font = "large";
            if (p.motion === "reduce") document.documentElement.dataset.motion = "reduce";
          }
        } catch { /* Invalid preferences remain untouched; runtime handles legacy defaults. */ }
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#0e1420" : "#f2f4f7";
      })();
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Crect width='36' height='36' rx='8' fill='%232457f5'/%3E%3Cpath d='M11 26V10l14 16V10' fill='none' stroke='white' stroke-width='2.8' stroke-linejoin='round' stroke-linecap='round'/%3E%3Ccircle cx='25' cy='10' r='3' fill='%23ffb020'/%3E%3C/svg%3E" />
    <link rel="apple-touch-icon" href="art/app-icon-180.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
